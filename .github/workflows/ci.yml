name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit Tests
        run: dotnet test tests/GreptimeDB.Ingester.Tests --no-build --configuration Release --verbosity normal

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Start GreptimeDB
        run: |
          docker run -d \
            -p 4000:4000 \
            -p 4001:4001 \
            -p 4002:4002 \
            -p 4003:4003 \
            --name greptimedb \
            greptime/greptimedb:v1.0.0-beta.4 standalone start \
            --http-addr 0.0.0.0:4000 \
            --rpc-bind-addr 0.0.0.0:4001 \
            --mysql-addr 0.0.0.0:4002 \
            --postgres-addr 0.0.0.0:4003

      - name: Wait for GreptimeDB
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:4000/health; then
              echo "GreptimeDB is ready"
              exit 0
            fi
            echo "Waiting for GreptimeDB... ($i/30)"
            sleep 2
          done
          echo "GreptimeDB failed to start"
          docker logs greptimedb
          exit 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Integration Tests
        run: dotnet test tests/GreptimeDB.Ingester.IntegrationTests --configuration Release --verbosity normal
        env:
          GREPTIMEDB_ENDPOINT: http://localhost:4001
          GREPTIMEDB_DATABASE: public
